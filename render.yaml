databases:
  - name: applyflow-db
    databaseName: applyflow
    user: applyflow
    plan: free

services:
  - type: web
    name: applyflow
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PG_CONNECTION_STRING
        fromDatabase:
          name: applyflow-db
          property: connectionString
